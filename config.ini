[Laws]
koap = Статья 18.1. Умышленное блокирование транспортных коммуникаций\т1.	Умышленное блокирование транспортных коммуникаций путем создания препятствий, установки постов или иным способом. Штраф от 6 до 50 б.в.\n2.	Умышленное блокирование транспортных коммуникаций лицом, управляющим транспортным средством, в месте проведения массового мероприятия либо повлекшее создание аварийной обстановки. Штраф от 6 до 50 б.в.\nСтатья 18.8. Нарушение правил пользования транспортным средством\n1.	Выбрасывание мусора или иных предметов из транспортного средства. Штраф от 2 до 10 б.в.\n2.	Открытие дверей транспортного средства во время движения. Штраф от 2 до 10 б.в.\nСтатья 18.11. Нарушение правил эксплуатации транспортного средства\n1.	Управление транспортным средством, имеющим неисправности тормозной системы, рулевого управления, стеклоочистителей (во время выпадения осадков), с негорящими фарами и (или) задними габаритными огнями (в темное время суток и (или) в условиях недостаточной видимости), с неисправностями либо несоблюдением условий в отношении колес и шин, при наличии которых правилами дорожного движения запрещено его участие в дорожном движении. Штраф от 1 до 3 б.в.\n2.	Управление транспортным средством, имеющим неисправности, за исключением неисправностей, указанных в части 1 настоящей статьи, либо с несоблюдением условий, при наличии которых правилами дорожного движения запрещено его участие в дорожном движении. Штраф до 1 б.в.\n3.	Управление транспортным средством водителем, не пристегнутым ремнем безопасности, перевозка пассажиров, не пристегнутых ремнями безопасности, если конструкцией транспортного средства предусмотрены ремни безопасности, перевозка детей с нарушением правил перевозки пассажиров, а равно управление мотоциклом, мопедом либо перевозка на них пассажиров без мотошлемов или с незастегнутыми мотошлемами. Штраф до 1 б.в.\n4.	.Управление транспортным средством, в отношении которого не выдано разрешение на допуск к участию в дорожном движении, если собственником (владельцем) такого транспортного средства является физическое лицо. Штраф до 3 б.в.\n5.	Эксплуатация в дорожном движении транспортного средства, в отношении которого не выдано разрешение на допуск к участию в дорожном движении, если собственником (владельцем) такого транспортного средства являются юридическое лицо или индивидуальный предприниматель. Штраф до 10 б.в.\n6.	Управление транспортным средством с заведомо скрытым, подделанным (подложным) или иным образом измененным регистрационным (номерным) знаком, идентификационным номером кузова или шасси либо без присвоенного регистрационного (номерного) знака. Штраф от 10 до 20 б.в.\n7.	Действия, предусмотренные частями 1–4 настоящей статьи, совершенные повторно в течение одного года после наложения административного взыскания за такие же нарушения. Штраф от 2 до 5 б.в.Статья 18.12. Превышение скорости движения\n1.	Превышение лицом, управляющим транспортным средством, установленной скорости движения от десяти до двадцати километров в час. Штраф до 1 б.в.\n2.	Превышение лицом, управляющим транспортным средством, установленной скорости движения от двадцати до тридцати километров в час. Штраф от 1 до 3 б.в.
