[Laws]
koap = Кодекс об административных правонарушениях\n\nСтатья 6.8. Незаконный оборот наркотических средств, психотропных веществ или их аналогов\n\n6.8.1 Незаконные приобретение, хранение, перевозка, изготовление, переработка без цели сбыта наркотических средств (в небольшом размере, не образующем состава уголовного преступления). Штраф от 4 000 до 5 000 рублей или административный арест до 15 суток.\n\nСтатья 7.27. Мелкое хищение\n\n7.27.1 Мелкое хищение чужого имущества, стоимость которого не превышает 1 000 рублей, путем кражи, мошенничества, присвоения или растраты. Штраф в размере до пятикратной стоимости похищенного имущества (но не менее 1 000 рублей), или административный арест до 15 суток, или обязательные работы до 50 часов.\n\n7.27.2 Мелкое хищение чужого имущества стоимостью более 1 000 рублей, но не более 2 500 рублей. Штраф в размере до пятикратной стоимости похищенного имущества (но не менее 3 000 рублей), или административный арест от 10 до 15 суток, или обязательные работы до 120 часов.\n\nСтатья 12.1. Управление транспортным средством, не зарегистрированным в установленном порядке\n\n12.1.1 Управление транспортным средством, не зарегистрированным в установленном порядке. Штраф от 500 до 800 рублей.\n\n12.1.1.1 Повторное совершение административного правонарушения, предусмотренного частью 1 настоящей статьи. Штраф 5 000 рублей или лишение права управления ТС на срок от 1 до 3 месяцев.\n\nСтатья 12.2. Управление транспортным средством с нарушением правил установки на нем государственных регистрационных знаков\n\n12.2.1 Управление ТС с нечитаемыми, нестандартными или установленными с нарушением требований государственного стандарта государственными регистрационными знаками. Предупреждение или штраф 500 рублей.\n\n12.2.2 Управление ТС без государственных регистрационных знаков, а равно управление ТС без установленных на предусмотренных для этого местах знаков или с видоизмененными знаками. Штраф 5 000 рублей или лишение права управления ТС на срок от 1 до 3 месяцев.\n\n12.2.4 Управление транспортным средством с заведомо подложными государственными регистрационными знаками. Лишение права управления ТС на срок от 6 месяцев до 1 года.\n\nСтатья 12.3. Управление транспортным средством водителем, не имеющим при себе документов\n\n12.3.1 Управление ТС водителем, не имеющим при себе регистрационных документов на данное транспортное средство. Предупреждение или штраф 500 рублей.\n\n12.3.2 Управление ТС водителем, не имеющим при себе водительского удостоверения. Предупреждение или штраф 500 рублей.\n\nСтатья 12.5. Управление транспортным средством при наличии неисправностей или условий, при которых эксплуатация запрещена\n\n12.5.1 Управление ТС при наличии неисправностей или условий, при которых эксплуатация транспортного средства запрещена. Предупреждение или штраф 500 рублей.\n\n12.5.3.1 Управление транспортным средством, на котором установлены стекла (в том числе покрытые прозрачными цветными пленками), светопропускание которых не соответствует требованиям технического регламента (тонировка). Штраф 500 рублей.\n\nСтатья 12.6. Нарушение правил применения ремней безопасности или мотошлемов\n\n12.6.1 Управление ТС водителем, не пристегнутым ремнем безопасности, перевозка пассажиров, не пристегнутых ремнями безопасности, а равно управление мотоциклом или мопедом без мотошлема. Штраф 1 500 рублей.\n\nСтатья 12.7. Управление транспортным средством водителем, не имеющим права управления транспортным средством\n\n12.7.1 Управление транспортным средством водителем, не имеющим права управления ТС (за исключением учебной езды). Штраф от 5 000 до 15 000 рублей (с задержанием ТС).\n\n12.7.2 Управление транспортным средством водителем, лишенным права управления транспортными средствами. Штраф 30 000 рублей, или административный арест до 15 суток, или обязательные работы от 100 до 200 часов.\n\n12.7.3 Передача управления транспортным средством лицу, заведомо не имеющему права управления ТС или лишенному такого права. Штраф 30 000 рублей.\n\nСтатья 12.8. Управление транспортным средством водителем, находящимся в состоянии опьянения, передача управления лицу, находящемуся в состоянии опьянения\n\n12.8.1 Управление транспортным средством водителем, находящимся в состоянии опьянения, если такие действия не содержат уголовно наказуемого деяния. Штраф 45 000 рублей с лишением права управления ТС на срок от 1,5 до 2 лет (с задержанием ТС).\n\n12.8.2 Передача управления транспортным средством лицу, находящемуся в состоянии опьянения. Штраф 45 000 рублей с лишением права управления ТС на срок от 1,5 до 2 лет.\n\n12.8.3 Управление ТС водителем, находящимся в состоянии опьянения и не имеющим права управления ТС либо лишенным права управления. Административный арест от 10 до 15 суток или штраф 45 000 рублей.\n\nСтатья 12.9. Превышение установленной скорости движения\n\n12.9.2 Превышение установленной скорости движения транспортного средства на величину более 20, но не более 40 километров в час. Штраф 750 рублей.\n\n12.9.3 Превышение установленной скорости движения транспортного средства на величину более 40, но не более 60 километров в час. Штраф от 1 500 до 2 250 рублей.\n\n12.9.4 Превышение установленной скорости движения транспортного средства на величину более 60, но не более 80 километров в час. Штраф от 3 000 до 3 750 рублей или лишение права управления ТС на срок от 4 до 6 месяцев.\n\n12.9.5 Превышение установленной скорости движения транспортного средства на величину более 80 километров в час. Штраф 7 500 рублей или лишение права управления ТС на срок 6 месяцев.\n\nСтатья 12.12. Проезд на запрещающий сигнал светофора или на запрещающий жест регулировщика\n\n12.12.1 Проезд на запрещающий сигнал светофора или на запрещающий жест регулировщика. Штраф 1 500 рублей.\n\n12.12.3 Повторное совершение административного правонарушения, предусмотренного частью 1 настоящей статьи. Штраф 7 500 рублей или лишение права управления ТС на срок от 4 до 6 месяцев.\n\nСтатья 12.14. Нарушение правил маневрирования\n\n12.14.1 Невыполнение требования ПДД подать сигнал перед началом движения, перестроением, поворотом, разворотом или остановкой. Предупреждение или штраф 500 рублей.\n\n12.14.2 Разворот или движение задним ходом в местах, где такие маневры запрещены. Штраф 500 рублей.\n\nСтатья 12.15. Нарушение правил расположения транспортного средства на проезжей части дороги, встречного разъезда или обгона\n\n12.15.1 Нарушение правил расположения ТС на проезжей части дороги, встречного разъезда, а равно движение по обочинам. Штраф 2 250 рублей.\n\n12.15.4 Выезд в нарушение ПДД на полосу, предназначенную для встречного движения, либо на трамвайные пути встречного направления. Штраф 7 500 рублей или лишение права управления ТС на срок от 4 до 6 месяцев.\n\nСтатья 12.16. Несоблюдение требований, предписанных дорожными знаками или разметкой проезжей части дороги\n\n12.16.1 Несоблюдение требований, предписанных дорожными знаками или разметкой проезжей части дороги. Предупреждение или штраф 750 рублей.\n\n12.16.2 Поворот налево или разворот в нарушение требований, предписанных дорожными знаками или разметкой. Штраф от 1 500 до 2 250 рублей.\n\n12.16.3 Движение во встречном направлении по дороге с односторонним движением. Штраф 7 500 рублей или лишение права управления ТС на срок от 4 до 6 месяцев.\n\nСтатья 12.18. Непредоставление преимущества в движении пешеходам или иным участникам дорожного движения\n\n12.18.1 Невыполнение требования ПДД уступить дорогу пешеходам, велосипедистам или иным участникам дорожного движения, пользующимся преимуществом в движении. Штраф от 1 500 до 2 500 рублей.\n\nСтатья 12.19. Нарушение правил остановки или стоянки транспортных средств\n\n12.19.1 Нарушение правил остановки или стоянки транспортных средств. Предупреждение или штраф 500 рублей.\n\n12.19.2 Нарушение правил остановки или стоянки транспортных средств в местах, отведенных для остановки или стоянки ТС инвалидов. Штраф 5 000 рублей (с задержанием ТС).\n\n12.19.3 Остановка или стоянка транспортных средств на пешеходном переходе и ближе 5 метров перед ним либо на тротуаре. Штраф 1 000 рублей (с задержанием ТС).\n\nСтатья 12.24. Нарушение Правил дорожного движения, повлекшее причинение легкого или средней тяжести вреда здоровью потерпевшего\n\n12.24.1 Нарушение ПДД или эксплуатации ТС, повлекшее причинение легкого вреда здоровью потерпевшего. Штраф от 3 750 до 7 500 рублей или лишение права управления ТС на срок от 1 года до 1,5 лет.\n\n12.24.2 Нарушение ПДД или эксплуатации ТС, повлекшее причинение средней тяжести вреда здоровью потерпевшего. Штраф от 15 000 до 37 500 рублей или лишение права управления ТС на срок от 1,5 до 2 лет.\n\nСтатья 12.25. Невыполнение требования о предоставлении транспортного средства или об остановке транспортного средства\n\n12.25.1 Невыполнение требования о предоставлении ТС сотрудникам полиции или иным лицам, которым предоставлено право использовать транспортные средства. Штраф 500 рублей.\n\n12.25.2 Невыполнение законного требования сотрудника полиции об остановке транспортного средства. Штраф от 7 000 до 10 000 рублей.\n\n12.25.4 Повторное совершение административного правонарушения, предусмотренного частью 2 настоящей статьи. Штраф 10 000 рублей или лишение права управления ТС на срок от 4 до 6 месяцев.\n\nСтатья 12.26. Невыполнение водителем транспортного средства требования о прохождении медицинского освидетельствования на состояние опьянения\n\n12.26.1 Невыполнение водителем ТС законного требования уполномоченного должностного лица о прохождении медицинского освидетельствования на состояние опьянения. Штраф 45 000 рублей с лишением права управления ТС на срок от 1,5 до 2 лет.\n\n12.26.2 То же деяние, совершенное водителем, не имеющим права управления ТС либо лишенным права управления. Административный арест от 10 до 15 суток или штраф 45 000 рублей.\n\nСтатья 12.27. Невыполнение обязанностей в связи с дорожно-транспортным происшествием\n\n12.27.1 Невыполнение водителем обязанностей, предусмотренных ПДД, в связи с ДТП, участником которого он является. Штраф 1 000 рублей.\n\n12.27.2 Оставление водителем в нарушение ПДД места дорожно-транспортного происшествия, участником которого он являлся. Лишение права управления ТС на срок от 1 года до 1,5 лет или административный арест до 15 суток.\n\nСтатья 12.29. Нарушение Правил дорожного движения пешеходом или иным лицом, участвующим в процессе дорожного движения\n\n12.29.1 Нарушение ПДД пешеходом или пассажиром транспортного средства. Предупреждение или штраф 500 рублей.\n\nСтатья 19.3. Неповиновение законному распоряжению сотрудника полиции\n\n19.3.1 Неповиновение законному распоряжению или требованию сотрудника полиции в связи с исполнением им обязанностей по охране общественного порядка и обеспечению общественной безопасности, а равно воспрепятствование исполнению им служебных обязанностей. Штраф от 2 000 до 4 000 рублей, или административный арест до 15 суток, или обязательные работы от 40 до 120 часов.\n\nСтатья 20.1. Мелкое хулиганство\n\n20.1.1 Мелкое хулиганство, то есть нарушение общественного порядка, выражающее явное неуважение к обществу, сопровождающееся нецензурной бранью в общественных местах, оскорбительным приставанием к гражданам, а равно уничтожением или повреждением чужого имущества. Штраф от 500 до 1 000 рублей или административный арест до 15 суток.\n\n20.1.2 Те же действия, сопряженные с неповиновением законному требованию представителя власти. Штраф от 1 000 до 2 500 рублей или административный арест до 15 суток.\n\nСтатья 20.20. Потребление (распитие) алкогольной продукции в запрещенных местах\n\n20.20.1 Потребление (распитие) алкогольной продукции в местах, запрещенных федеральным законом (дворы, подъезды, парки, скверы, общественный транспорт). Штраф от 500 до 1 500 рублей.\n\nСтатья 20.21. Появление в общественных местах в состоянии опьянения\n\n20.21.1 Появление на улицах, стадионах, в скверах, парках, в транспортном средстве общего пользования, в других общественных местах в состоянии опьянения, оскорбляющем человеческое достоинство и общественную нравственность. Штраф от 500 до 1 500 рублей или административный арест до 15 суток.
uk = Уголовный кодекс\n\nСтатья 105. Убийство\n\n105.1 Убийство, то есть умышленное причинение смерти другому человеку. Лишение свободы от 6 до 15 лет.\n\n105.2 Убийство двух или более лиц, совершенное общеопасным способом, с особой жестокостью, группой лиц либо из корыстных побуждений. Лишение свободы от 8 до 20 лет либо пожизненное лишение свободы.\n\nСтатья 111. Умышленное причинение тяжкого вреда здоровью\n\n111.1 Умышленное причинение тяжкого вреда здоровью, опасного для жизни человека. Лишение свободы до 8 лет.\n\n111.2 То же деяние, совершенное в отношении лица в связи с осуществлением им служебной деятельности, с особой жестокостью либо с применением оружия. Лишение свободы до 10 лет.\n\nСтатья 112. Умышленное причинение средней тяжести вреда здоровью\n\n112.1 Умышленное причинение средней тяжести вреда здоровью, не опасного для жизни, но вызвавшего длительное расстройство здоровья. Ограничение свободы до 3 лет, или принудительные работы до 3 лет, или арест до 6 месяцев, или лишение свободы до 3 лет.\n\n112.2 То же деяние, совершенное в отношении двух или более лиц, группой лиц либо с применением оружия. Лишение свободы до 5 лет.\n\nСтатья 115. Умышленное причинение легкого вреда здоровью\n\n115.1 Умышленное причинение легкого вреда здоровью, вызвавшего кратковременное расстройство здоровья. Штраф до 40 000 рублей, или обязательные работы до 480 часов, или исправительные работы до 1 года, или арест до 4 месяцев.\n\n115.2 То же деяние, совершенное из хулиганских побуждений либо с применением оружия или предметов, используемых в качестве оружия. Обязательные работы до 360 часов, или исправительные работы до 1 года, или принудительные работы до 2 лет, или лишение свободы до 2 лет.\n\nСтатья 126. Похищение человека\n\n126.1 Похищение человека. Принудительные работы до 5 лет либо лишение свободы до 5 лет.\n\n126.2 Похищение человека, совершенное группой лиц по предварительному сговору, с применением насилия, опасного для жизни или здоровья, либо с применением оружия. Лишение свободы от 5 до 12 лет.\n\nСтатья 158. Кража\n\n158.1 Кража, то есть тайное хищение чужого имущества. Штраф до 80 000 рублей, или обязательные работы до 360 часов, или исправительные работы до 1 года, или лишение свободы до 2 лет.\n\n158.2 Кража, совершенная группой лиц по предварительному сговору либо с незаконным проникновением в помещение или иное хранилище. Штраф до 200 000 рублей, или обязательные работы до 480 часов, или принудительные работы до 5 лет, или лишение свободы до 5 лет.\n\nСтатья 161. Грабеж\n\n161.1 Грабеж, то есть открытое хищение чужого имущества. Обязательные работы до 480 часов, или исправительные работы до 2 лет, или принудительные работы до 4 лет, или лишение свободы до 4 лет.\n\n161.2 Грабеж, совершенный группой лиц по предварительному сговору, с незаконным проникновением в жилище либо с применением насилия, не опасного для жизни или здоровья. Принудительные работы до 5 лет либо лишение свободы до 7 лет.\n\nСтатья 162. Разбой\n\n162.1 Разбой, то есть нападение в целях хищения чужого имущества, совершенное с применением насилия, опасного для жизни или здоровья, либо с угрозой применения такого насилия. Принудительные работы до 5 лет либо лишение свободы до 8 лет.\n\n162.2 Разбой, совершенный группой лиц по предварительному сговору, а равно с применением оружия или предметов, используемых в качестве оружия. Лишение свободы до 10 лет.\n\nСтатья 166. Неправомерное завладение автомобилем или иным транспортным средством без цели хищения (Угон)\n\n166.1 Неправомерное завладение автомобилем или иным транспортным средством без цели хищения (угон). Штраф до 120 000 рублей, или ограничение свободы до 3 лет, или принудительные работы до 5 лет, или лишение свободы до 5 лет.\n\n166.2 То же деяние, совершенное группой лиц по предварительному сговору либо с применением насилия, не опасного для жизни или здоровья. Штраф до 200 000 рублей, или принудительные работы до 5 лет, или лишение свободы до 7 лет.\n\n166.4 Деяния, предусмотренные частями 1 или 2 настоящей статьи, совершенные с применением насилия, опасного для жизни или здоровья, либо с угрозой применения такого насилия. Лишение свободы до 12 лет.\n\nСтатья 167. Умышленные уничтожение или повреждение имущества\n\n167.1 Умышленные уничтожение или повреждение чужого имущества, если эти деяния повлекли причинение значительного ущерба. Штраф до 40 000 рублей, или обязательные работы до 360 часов, или исправительные работы до 1 года, или лишение свободы до 2 лет.\n\n167.2 Те же деяния, совершенные из хулиганских побуждений, путем поджога, взрыва или иным общеопасным способом. Принудительные работы до 5 лет либо лишение свободы до 5 лет.\n\nСтатья 205. Террористический акт\n\n205.1 Совершение взрыва, поджога или иных действий, устрашающих население и создающих опасность гибели человека, в целях дестабилизации деятельности органов власти. Лишение свободы от 10 до 20 лет.\n\n205.2 Те же деяния, совершенные группой лиц по предварительному сговору или организованной группой. Лишение свободы от 12 до 20 лет.\n\nСтатья 206. Захват заложника\n\n206.1 Захват или удержание лица в качестве заложника в целях понуждения государства, организации или гражданина совершить какое-либо действие или воздержаться от совершения какого-либо действия. Лишение свободы от 5 до 10 лет.\n\n206.2 То же деяние, совершенное группой лиц по предварительному сговору, с применением насилия, опасного для жизни или здоровья, либо с применением оружия. Лишение свободы от 6 до 15 лет.\n\nСтатья 207. Заведомо ложное сообщение об акте терроризма\n\n207.1 Заведомо ложное сообщение о готовящихся взрыве, поджоге или иных действиях, создающих опасность гибели людей. Штраф от 200 000 до 500 000 рублей, или обязательные работы до 480 часов, или ограничение свободы до 3 лет.\n\n207.2 То же деяние, совершенное в отношении объектов социальной инфраструктуры либо повлекшее причинение крупного ущерба. Штраф от 500 000 до 700 000 рублей либо лишение свободы от 3 до 5 лет.\n\nСтатья 213. Хулиганство\n\n213.1 Хулиганство, то есть грубое нарушение общественного порядка, выражающее явное неуважение к обществу, совершенное с применением насилия к гражданам либо угрозой его применения. Штраф от 300 000 до 500 000 рублей, или обязательные работы до 480 часов, или принудительные работы до 5 лет, или лишение свободы до 5 лет.\n\n213.2 То же деяние, совершенное группой лиц по предварительному сговору, с применением оружия или предметов, используемых в качестве оружия, либо связанное с сопротивлением представителю власти. Штраф от 500 000 до 1 000 000 рублей, или принудительные работы до 5 лет, или лишение свободы до 7 лет.\n\nСтатья 222. Незаконные приобретение, передача, сбыт, хранение, перевозка, пересылка или ношение оружия, основных частей огнестрельного оружия, боеприпасов\n\n222.1 Незаконные приобретение, передача, хранение, перевозка, пересылка или ношение огнестрельного оружия, его основных частей и боеприпасов (за исключением гражданского огнестрельного гладкоствольного длинноствольного оружия). Ограничение свободы до 3 лет, или принудительные работы до 4 лет, или арест до 6 месяцев, или лишение свободы от 3 до 5 лет со штрафом до 80 000 рублей.\n\n222.2 Незаконный сбыт огнестрельного оружия, его основных частей, боеприпасов. Лишение свободы от 5 до 8 лет со штрафом до 100 000 рублей.\n\nСтатья 228. Незаконные приобретение, хранение, перевозка, изготовление, переработка наркотических средств, психотропных веществ или их аналогов\n\n228.1 Незаконные приобретение, хранение, перевозка, изготовление, переработка без цели сбыта наркотических средств в значительном размере. Штраф до 40 000 рублей, или обязательные работы до 480 часов, или исправительные работы до 2 лет, или лишение свободы до 3 лет.\n\n228.2 Те же деяния, совершенные в крупном размере. Лишение свободы от 3 до 10 лет со штрафом до 500 000 рублей.\n\nСтатья 228.1. Незаконные производство, сбыт или пересылка наркотических средств, психотропных веществ или их аналогов\n\n228.1.1 Незаконные производство, сбыт или пересылка наркотических средств, психотропных веществ или их аналогов. Лишение свободы от 4 до 8 лет.\n\n228.1.3 Те же деяния, совершенные группой лиц по предварительному сговору или в значительном размере. Лишение свободы от 8 до 15 лет.\n\nСтатья 264. Нарушение правил дорожного движения и эксплуатации транспортных средств\n\n264.1 Нарушение ПДД или эксплуатации транспортных средств, повлекшее по неосторожности причинение тяжкого вреда здоровью человека. Ограничение свободы до 3 лет, или принудительные работы до 2 лет с лишением права управлять ТС до 3 лет, или лишение свободы до 2 лет с лишением права управлять ТС до 3 лет.\n\n264.2 То же деяние, совершенное лицом, находящимся в состоянии опьянения либо сопряженное с оставлением места его совершения. Принудительные работы до 5 лет с лишением права управлять ТС до 3 лет либо лишение свободы от 3 до 7 лет с лишением права управлять ТС до 3 лет.\n\n264.3 Деяние, предусмотренное частью 1 настоящей статьи, повлекшее по неосторожности смерть человека. Принудительные работы до 4 лет с лишением права управлять ТС до 3 лет либо лишение свободы до 5 лет с лишением права управлять ТС до 3 лет.\n\nСтатья 264.1. Управление транспортным средством в состоянии опьянения лицом, подвергнутым административному наказанию или имеющим судимость\n\n264.1.1 Управление автомобилем или другим механическим транспортным средством лицом, находящимся в состоянии опьянения, подвергнутым административному наказанию за управление ТС в состоянии опьянения или за невыполнение требования о прохождении медосвидетельствования. Штраф от 200 000 до 300 000 рублей, или обязательные работы до 480 часов, или принудительные работы до 2 лет, или лишение свободы до 2 лет с лишением права управлять ТС до 3 лет.\n\n264.1.2 То же деяние, совершенное лицом, имеющим судимость за аналогичное преступление. Штраф от 300 000 до 500 000 рублей, или исправительные работы до 2 лет, или ограничение свободы до 3 лет, или принудительные работы до 3 лет, или лишение свободы до 3 лет с лишением права управлять ТС до 6 лет.\n\nСтатья 291. Дача взятки\n\n291.1 Дача взятки должностному лицу лично или через посредника. Штраф до 500 000 рублей, или исправительные работы до 2 лет, или принудительные работы до 3 лет, или лишение свободы до 2 лет.\n\n291.3 Дача взятки должностному лицу за совершение заведомо незаконных действий (бездействие). Штраф до 1 500 000 рублей, или принудительные работы до 5 лет, или лишение свободы до 8 лет.\n\nСтатья 317. Посягательство на жизнь сотрудника правоохранительного органа\n\n317.1 Посягательство на жизнь сотрудника правоохранительного органа в целях воспрепятствования законной деятельности по охране общественного порядка и обеспечению общественной безопасности либо из мести за такую деятельность. Лишение свободы от 12 до 20 лет либо пожизненное лишение свободы.\n\nСтатья 318. Применение насилия в отношении представителя власти\n\n318.1 Применение насилия, не опасного для жизни или здоровья, либо угроза применения насилия в отношении представителя власти или его близких в связи с исполнением им своих должностных обязанностей. Штраф до 200 000 рублей, или принудительные работы до 5 лет, или арест до 6 месяцев, или лишение свободы до 5 лет.\n\n318.2 Применение насилия, опасного для жизни или здоровья, в отношении лиц, указанных в части 1 настоящей статьи. Лишение свободы до 10 лет.\n\nСтатья 319. Оскорбление представителя власти\n\n319.1 Публичное оскорбление представителя власти при исполнении им своих должностных обязанностей или в связи с их исполнением. Штраф до 40 000 рублей, или обязательные работы до 360 часов, или исправительные работы до 1 года.\n\nСтатья 327. Подделка, изготовление или оборот поддельных документов, государственных наград, штампов, печатей или бланков\n\n327.1 Подделка официального документа, предоставляющего права или освобождающего от обязанностей, в целях его использования или сбыт такого документа. Ограничение свободы до 2 лет, или принудительные работы до 2 лет, или арест до 6 месяцев, или лишение свободы до 2 лет.\n\n327.3 Приобретение, хранение, перевозка в целях использования или сбыта либо использование заведомо поддельных паспорта гражданина, удостоверения или иного официального документа (включая поддельное водительское удостоверение). Ограничение свободы до 1 года, или принудительные работы до 1 года, или лишение свободы до 1 года.
