[Laws]
koap = Административная ответственность за нарушение Правил дорожного движения\n\nСтатья 18.1. Умышленное блокирование транспортных коммуникаций\n\n18.1.1 Умышленное блокирование транспортных коммуникаций путем создания препятствий, установки постов или иным способом. Штраф от 6 до 50 б.в.\n\n18.1.2 Умышленное блокирование транспортных коммуникаций лицом, управляющим транспортным средством, в месте проведения массового мероприятия либо повлекшее создание аварийной обстановки. Штраф от 6 до 50 б.в.\n\nСтатья 18.2. Нарушение правил пользования транспортным средством\n\n18.2.1 Выбрасывание мусора или иных предметов из транспортного средства. Штраф от 2 до 10 б.в.\n\n18.2.2 Открытие дверей транспортного средства во время движения. Штраф от 2 до 10 б.в.\n\nСтатья 18.3. Нарушение правил эксплуатации транспортного средства\n\n18.3.1 Управление транспортным средством, имеющим неисправности тормозной системы, рулевого управления, стеклоочистителей (во время выпадения осадков), с негорящими фарами и (или) задними габаритными огнями (в темное время суток и (или) в условиях недостаточной видимости), с неисправностями либо несоблюдением условий в отношении колес и шин, при наличии которых правилами дорожного движения запрещено его участие в дорожном движении. Штраф от 1 до 3 б.в.\n\n18.3.2 Управление транспортным средством, имеющим неисправности, за исключением неисправностей, указанных в части 1 настоящей статьи, либо с несоблюдением условий, при наличии которых правилами дорожного движения запрещено его участие в дорожном движении. Штраф до 1 б.в.\n\n18.3.3 Управление транспортным средством водителем, не пристегнутым ремнем безопасности, перевозка пассажиров, не пристегнутых ремнями безопасности, если конструкцией транспортного средства предусмотрены ремни безопасности, перевозка детей с нарушением правил перевозки пассажиров, а равно управление мотоциклом, мопедом либо перевозка на них пассажиров без мотошлемов или с незастегнутыми мотошлемами. Штраф до 1 б.в.\n\n18.3.4 Управление транспортным средством, в отношении которого не выдано разрешение на допуск к участию в дорожном движении, если собственником (владельцем) такого транспортного средства является физическое лицо. Штраф до 3 б.в.\n\n18.3.5 Эксплуатация в дорожном движении транспортного средства, в отношении которого не выдано разрешение на допуск к участию в дорожном движении, если собственником (владельцем) такого транспортного средства являются юридическое лицо или индивидуальный предприниматель. Штраф до 10 б.в.\n\n18.3.6 Управление транспортным средством с заведомо скрытым, подделанным (подложным) или иным образом измененным регистрационным (номерным) знаком, идентификационным номером кузова или шасси либо без присвоенного регистрационного (номерного) знака. Штраф от 10 до 20 б.в.\n\n18.3.7 Действия, предусмотренные частями 1–4 настоящей статьи, совершенные повторно в течение одного года после наложения административного взыскания за такие же нарушения. Штраф от 2 до 5 б.в.\n\nСтатья 18.4. Превышение скорости движения\n\n18.4.1 Превышение лицом, управляющим транспортным средством, установленной скорости движения от десяти до двадцати километров в час. Штраф до 1 б.в.\n\n18.4.2 Превышение лицом, управляющим транспортным средством, установленной скорости движения от двадцати до тридцати километров в час. Штраф от 1 до 3 б.в.\n\n18.4.3 Превышение лицом, управляющим транспортным средством, установленной скорости движения от тридцати до сорока километров в час. Штраф от 3 до 10 б.в.\n\n18.4.4 Превышение лицом, управляющим транспортным средством, установленной скорости движения на сорок и более километров в час. Штраф от 8 до 12 б.в.\n\n18.4.5 Действия, предусмотренные частями 2–4 настоящей статьи, совершенные повторно в течение одного года после наложения административного взыскания за такие же нарушения. Штраф от 5 до 15 б.в. и (или) лишение прав на управление Т/С до 1 года.\n\nСтатья 18.5. Невыполнение требований сигналов регулирования дорожного движения, нарушение правил перевозки пассажиров или других правил дорожного движения\n\n18.5.1 Невыполнение лицом, управляющим транспортным средством, требований сигналов, указаний светофора или регулировщика. Штраф от 1 до 5 б.в.\n\n18.5.2 Нарушение лицом, управляющим транспортным средством, правил движения транспортных средств в жилых зонах. Штраф до 3 б.в.\n\n18.5.3 Нарушение лицом, управляющим транспортным средством, правил движения по автомагистрали, пользования внешними световыми приборами или звуковыми сигналами, буксировки транспортных средств, а равно нарушение правил применения аварийной сигнализации и знака аварийной остановки. Штраф до 3 б.в.\n\n18.5.4 Нарушение лицом, управляющим транспортным средством, правил пользования звуковыми сигналами в месте проведения массового мероприятия. Штраф до 10 б.в.\n\n18.5.5 Нарушение лицом, управляющим транспортным средством (за исключением водителей транспортных средств оперативного назначения), правил пользования радио- и телефонной связью во время движения. Штраф до 2 б.в.\n\n18.5.6 Нарушение лицом, управляющим транспортным средством, правил перевозки пассажиров или грузов. Штраф до 4 б.в.\n\n18.5.7 Нарушение правил расположения транспортных средств на проезжей части, а равно непредоставление лицом, управляющим транспортным средством, преимущества в движении маршрутному транспортному средству, пешеходам, иным участникам дорожного движения. Штраф от 1 до 5 б.в.\n\n18.5.8 Невыполнение лицом, управляющим транспортным средством, требований дорожных знаков или разметки (за исключением выезда на полосу встречного движения) либо нарушение правил маневрирования или проезда перекрестков. Штраф от 1 до 5 б.в.\n\n18.5.9 Нарушение лицом, управляющим транспортным средством, правил обгона либо выезд на полосу встречного движения в случаях, когда это запрещено правилами дорожного движения. Штраф от 2 до 10 б.в. и (или) лишение прав на управление Т/С сроком до 1 года\n\n18.5.10 Невыполнение лицом, управляющим транспортным средством, правил дорожного движения по обеспечению беспрепятственного проезда транспортного средства оперативного назначения. Штраф от 2 до 10 б.в. и (или) лишение прав на управление Т/С сроком до 1 года\n\n18.5.11 Управление мотоциклом, мопедом на одном колесе, а равно движение, при котором лицо, управляющее таким транспортным средством, не держится за руль или не держит ноги на педалях (подножке). Штраф от 5 до 10 б.в. и (или) лишение прав на управление Т/С сроком до 1 года\n\n18.5.12 Нарушение правил дорожного движения, повлекшее создание аварийной обстановки. Штраф от 5 до 20 б.в. и (или) лишение прав на управление Т/С сроком до 2 лет\n\n18.5.13 Действия, предусмотренные частями 5–7 настоящей статьи, совершенные повторно в течение одного года после наложения административного взыскания за такие же нарушения. Штраф от 2 до 8 б.в.\n\nСтатья 18.6. Управление транспортным средством лицом, не имеющим права управления\n\n18.6.1 Управление транспортным средством лицом, не имеющим права управления этим средством, за исключением случаев, предусмотренных частью 3 настоящей статьи, а равно передача управления транспортным средством лицу, не имеющему права управления. Штраф от 5 до 20 б.в.\n\n18.6.2 Действия, предусмотренные частью 1 настоящей статьи, совершенные повторно в течение одного года после наложения административного взыскания за такие же нарушения. Штраф от 20 до 50 б.в.\n\n18.6.3 Управление транспортным средством лицом, не имеющим права управления этим средством вследствие истечения срока действия водительского удостоверения, а равно передача управления транспортным средством такому лицу. Штраф от 2 до 5 б.в.\n\nСтатья 18.7. Нарушение правил дорожного движения, повлекшее причинение потерпевшему легкого телесного повреждения, оставление места дорожно-транспортного происшествия\n\n18.7.1 Нарушение правил дорожного движения лицом, управляющим транспортным средством, повлекшее причинение потерпевшему легкого телесного повреждения. Штраф от 2 до 30 б.в.\n\n18.7.2 Оставление водителем места дорожно-транспортного происшествия, участником которого он является, в случаях, когда это запрещено законодательными актами. Штраф от 5 до 25 б.в.\n\nСтатья 18.8. Невыполнение требования об остановке транспортного средства\n\n18.8.1 Невыполнение лицом, управляющим транспортным средством, требования сотрудника органов внутренних дел об остановке транспортного средства. Штраф от 2 до 8 б.в.\n\n18.8.2 Невыполнение лицом, управляющим транспортным средством, неоднократных требований сотрудника органов внутренних дел об остановке транспортного средства. Штраф от 3 до 10 б.в.\n\n18.8.3 Деяние, предусмотренное частью 2 настоящей статьи, повлекшее преследование такого лица сотрудниками органов внутренних дел. Штраф от 30 до 50 б.в.\n\nСтатья 18.9. Нарушение правил остановки и стоянки транспортного средства, а также иных правил дорожного движения\n\n18.9.1 Остановка или стоянка транспортного средства с нарушением правил дорожного движения. Штраф 1 б.в.\n\n18.9.2 Неправомерная стоянка транспортного средства на месте, отведенном для стоянки транспортных средств инвалидов. Штраф 2 б.в.\n\n18.9.3 Остановка или стоянка грузового автомобиля и(или) автобуса с нарушением правил дорожного движения. Штраф 5 б.в.\n\n18.9.4 Действия, предусмотренные частью 3 настоящей статьи, совершенные повторно в течение одного года после наложения административного взыскания за такие же нарушения. Штраф 10 б.в.\n\nСтатья 18.10. Нарушение требований законодательства в области перевозки опасных грузов, веществ и предметов\n\n18.10.1 Нарушение лицом, управляющим транспортным средством, предназначенным для перевозки опасных грузов, предусмотренных законодательством требований безопасности при перевозке опасных грузов. Штраф от 0.5 до 5 б.в.
